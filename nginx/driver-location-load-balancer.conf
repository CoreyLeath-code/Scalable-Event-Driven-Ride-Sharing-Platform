worker_processes auto;

events {
  worker_connections 1024;
}

http {
  log_format upstream '$remote_addr "$request" $status '
                      'upstream=$upstream_addr upstream_status=$upstream_status '
                      'request_time=$request_time upstream_time=$upstream_response_time';
  access_log /var/log/nginx/access.log upstream;

  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream driver_location_backends {
    zone driver_location_backends 64k;
    least_conn;
    server driver-location-api:8000 resolve;
    keepalive 32;
  }

  server {
    listen 8000;
    server_name _;

    location = /nginx_status {
      stub_status;
      access_log off;
    }

    location = /driver-location/health {
      proxy_pass http://driver_location_backends;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }

    location = /driver-location/ready {
      proxy_pass http://driver_location_backends;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }

    location / {
      proxy_pass http://driver_location_backends;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
    }
  }
}
