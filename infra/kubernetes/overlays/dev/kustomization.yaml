apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../..

labels:
  - pairs:
      app.kubernetes.io/environment: dev

images:
  - name: api-gateway
    newName: ghcr.io/coreyleath-code/scalable-event-driven-ride-sharing-platform
    newTag: dev-unset

configMapGenerator:
  - name: ride-sharing-runtime
    behavior: merge
    literals:
      - APP_ENV=dev
      - AUTH_REQUIRED=false
      - DRIVER_LOCATION_REDIS_SECRET_ID=ride-sharing/dev/runtime
