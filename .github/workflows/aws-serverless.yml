name: AWS Serverless Validation

on:
  pull_request:
    paths:
      - "serverless/**"
      - "infra/aws/**"
      - "tests/test_aws_lambda_handlers.py"
      - ".github/workflows/aws-serverless.yml"
  push:
    branches: ["main"]
    paths:
      - "serverless/**"
      - "infra/aws/**"
      - "tests/test_aws_lambda_handlers.py"
      - ".github/workflows/aws-serverless.yml"

permissions:
  contents: read

jobs:
  lambda-unit-tests:
    name: Lambda unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Lambda handler tests
        run: pytest -q tests/test_aws_lambda_handlers.py

  terraform-validate:
    name: Terraform format and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/aws

      - name: Initialize Terraform without a backend
        working-directory: infra/aws
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: infra/aws
        run: terraform validate
